name: Build APK Android

# App là TWA: mở harptabs.pages.dev toàn màn hình qua Chrome, nên nội dung tự cập nhật
# theo mỗi lần deploy Pages. Chỉ cần build lại APK khi đổi android/twa-manifest.json.
on:
  push:
    branches: [main]
    paths:
      - 'android/twa-manifest.json'
      - 'android-recorder/twa-manifest.json'
      - 'android-kalimba/twa-manifest.json'
      - 'android-guitar/twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # cùng mã nguồn, bốn app: Harmonica, Sáo, Kalimba, Guitar (mỗi app một twa-manifest.json)
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: android
            file: harptabs
            tag: apk
            title: Harp Tab
            host: harptabs.pages.dev
            latest: 'true'
          - dir: android-recorder
            file: sotabsao
            tag: sao-apk
            title: Sổ Tab Sáo
            host: sotabsao.pages.dev
            latest: 'false'
          - dir: android-kalimba
            file: sotabkalimba
            tag: kalimba-apk
            title: Sổ Tab Kalimba
            host: sotabkalimba.pages.dev
            latest: 'false'
          - dir: android-guitar
            file: sotabguitar
            tag: guitar-apk
            title: Sổ Tab Guitar
            host: sotabguitar.pages.dev
            latest: 'false'
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chuẩn bị Bubblewrap và Android SDK
        run: |
          npm install -g @bubblewrap/cli@1.27.0
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" > /dev/null
          # Bubblewrap chỉ nhận SDK có thư mục tools/ hoặc bin/ ở gốc
          [ -e "$ANDROID_HOME/bin" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"

      - name: Đặt phiên bản và khoá ký
        working-directory: ${{ matrix.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          jq --argjson c "$VERSION_CODE" --arg n "$VERSION_NAME" '.appVersionCode = $c | .appVersion = $n' twa-manifest.json > m.json
          mv m.json twa-manifest.json
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      # app mới: Pages có thể đang deploy song song — chờ biểu tượng trên trang tải được (Bubblewrap cần tải về)
      - name: Chờ trang web của app sẵn sàng
        working-directory: ${{ matrix.dir }}
        run: |
          url=$(jq -r .iconUrl twa-manifest.json)
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "$url" && exit 0
            echo "Chờ $url ($i)…"; sleep 15
          done
          echo "::error::Không tải được $url"; exit 1

      - name: Sinh dự án Android
        working-directory: ${{ matrix.dir }}
        run: bubblewrap update --skipVersionUpgrade

      - name: Build và ký APK
        working-directory: ${{ matrix.dir }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          bubblewrap build 2>&1 | tee build.log || {
            # đưa lỗi lên Annotations để xem được mà không cần mở log
            echo "::error title=bubblewrap build::$(grep -v '^\s*$' build.log | grep -iE -B2 -A8 'error|fail|what went wrong|exception' | tail -n 40 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            echo "::error title=bubblewrap build (cuối log)::$(grep -v '^\s*$' build.log | tail -n 20 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            exit 1
          }
          mv app-release-signed.apk "${{ matrix.file }}-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-apk
          path: ${{ matrix.dir }}/${{ matrix.file }}-*.apk

      - name: Đăng lên GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ matrix.tag }}-v$VERSION_NAME" "${{ matrix.dir }}/${{ matrix.file }}-$VERSION_NAME.apk" \
            --title "${{ matrix.title }} $VERSION_NAME (Android)" \
            --notes "Tải file .apk về điện thoại Android rồi mở để cài. Nội dung app tự cập nhật theo ${{ matrix.host }}." \
            --latest=${{ matrix.latest }}
