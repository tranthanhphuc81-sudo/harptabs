name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: a26c5a5c07ffa3054c4cefabbdffd75e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck Worker (dùng chung shared/ với app)
        run: npx tsc --noEmit -p worker
      - run: npm test
      - run: npm run build
      - name: Deploy dist lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name harptabs --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # cùng mã nguồn, bản Sổ Tab Sáo (sáo dọc) ra dự án Pages riêng
      - name: Build Sổ Tab Sáo
        env:
          VITE_APP: recorder
        run: npx vite build --outDir dist-recorder --emptyOutDir
      - name: Deploy Sổ Tab Sáo lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotabsao --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist-recorder --project-name sotabsao --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # bản Sổ Tab Kalimba ra dự án Pages riêng
      - name: Build Sổ Tab Kalimba
        env:
          VITE_APP: kalimba
        run: npx vite build --outDir dist-kalimba --emptyOutDir
      - name: Deploy Sổ Tab Kalimba lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotabkalimba --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist-kalimba --project-name sotabkalimba --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # bản Sổ Tab Guitar (guitar, ukulele) ra dự án Pages riêng
      - name: Build Sổ Tab Guitar
        env:
          VITE_APP: guitar
        run: npx vite build --outDir dist-guitar --emptyOutDir
      - name: Deploy Sổ Tab Guitar lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotabguitar --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist-guitar --project-name sotabguitar --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # bản Sổ Tab Pianica (kèn pianica / melodica) ra dự án Pages riêng
      - name: Build Sổ Tab Pianica
        env:
          VITE_APP: pianica
        run: npx vite build --outDir dist-pianica --emptyOutDir
      - name: Deploy Sổ Tab Pianica lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotabpianica --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist-pianica --project-name sotabpianica --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # bản Sổ Tab Đàn Tranh ra dự án Pages riêng
      - name: Build Sổ Tab Đàn Tranh
        env:
          VITE_APP: tranh
        run: npx vite build --outDir dist-tranh --emptyOutDir
      - name: Deploy Sổ Tab Đàn Tranh lên Pages
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotabdantranh --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist-tranh --project-name sotabdantranh --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
      # trang giới thiệu chung cho cả sáu app (trang tĩnh trong landing/)
      - name: Deploy trang giới thiệu Sổ Tab
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages project create sotab --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy landing --project-name sotab --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MSG" | head -n 1)"
